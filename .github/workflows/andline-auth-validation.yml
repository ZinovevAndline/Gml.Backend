name: ANDLINE GML authentication checks

on:
  push:
    branches: [master]
    paths:
      - "src/gml-core"
      - "src/Gml.Web.Api"
      - ".github/workflows/andline-auth-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout pinned API and private Core
        env:
          GML_READ_TOKEN: ${{ secrets.GML_READ_TOKEN || secrets.GML_SUBMODULES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GML_READ_TOKEN" ]; then
            echo "::error::Configure read-only GML_READ_TOKEN for the private Gml.Core submodule in Gml.Backend Actions secrets."
            exit 1
          fi
          askpass="$(mktemp)"
          printf '#!/bin/sh\\ncase "$1" in *Username*) echo x-access-token;; *Password*) printf "%%s\\n" "$GML_READ_TOKEN";; esac\\n' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git submodule update --init --depth=1 -- src/gml-core src/Gml.Web.Api

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test secure ANDLINE login and profile visibility
        run: |
          dotnet test src/Gml.Web.Api/tests/Gml.WebApi.Tests/Gml.WebApi.Tests.csproj \
            -c Release -p:GmlCoreRoot="$GITHUB_WORKSPACE/src/gml-core" \
            --filter 'FullyQualifiedName~AndlineAuthUrlTests|FullyQualifiedName~CustomEndpointAuthResponseTests|FullyQualifiedName~ProfileVisibilityTests'

      - name: Publish GML API and Core
        run: |
          dotnet publish src/Gml.Web.Api/src/Gml.Web.Api/Gml.Web.Api.csproj \
            -c Release -o /tmp/gml-andline-auth \
            -p:GmlCoreRoot="$GITHUB_WORKSPACE/src/gml-core" -p:UseAppHost=false
          test -s /tmp/gml-andline-auth/Gml.Web.Api.dll
